<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(97% 0.015 85)}
  a{color:oklch(45% 0.14 150)}
  a:hover{color:oklch(35% 0.14 150)}
</style>
</helmet>
<div style="font-family:'Space Grotesk',sans-serif;color:oklch(20% 0.02 85);min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="Nav" active="blog" hint-size="100%,56px"></dc-import>

  <div style="flex:1;max-width:800px;margin:0 auto;padding:56px 24px 40px;width:100%;box-sizing:border-box">
    <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:oklch(45% 0.14 150);margin-bottom:8px">$ ls ./blog --recent</div>
    <h1 style="font-size:42px;font-weight:700;margin:0 0 40px;letter-spacing:-0.02em">Tulisan</h1>

    <div style="display:flex;flex-direction:column;gap:0">
      <sc-for list="{{ posts }}" as="post" hint-placeholder-count="5">
        <a href="#" style="text-decoration:none;color:inherit;display:block;padding:24px 0;border-bottom:1.5px solid oklch(85% 0.02 85);transition:color 0.2s,transform 0.15s" style-hover="color:oklch(45% 0.14 150);transform:translateX(4px)">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
            <div style="font-weight:700;font-size:19px">{{ post.title }}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(45% 0.02 85);white-space:nowrap">{{ post.date }}</div>
          </div>
          <div style="font-size:14.5px;color:oklch(38% 0.02 85);margin-top:8px;line-height:1.6">{{ post.excerpt }}</div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <sc-for list="{{ post.tags }}" as="tag" hint-placeholder-count="2">
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;background:oklch(93% 0.02 85);border-radius:5px;padding:3px 8px;color:oklch(35% 0.02 85)">{{ tag }}</span>
            </sc-for>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <dc-import name="Footer" hint-size="100%,240px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const posts = [
      { title: 'Belajar dari Migrasi Monolith ke Microservices', date: 'Jun 2026', excerpt: 'Hal-hal yang saya harap tahu sebelum mulai memecah sistem lama jadi service kecil.', tags: ['backend', 'arsitektur'] },
      { title: 'Membangun Asisten Support dengan LLM di Produksi', date: 'Apr 2026', excerpt: 'Catatan praktis soal prompt, guardrail, dan evaluasi ketika AI menyentuh pelanggan asli.', tags: ['ai', 'produksi'] },
      { title: 'Kenapa Saya Berhenti Over-engineering Komponen React', date: 'Feb 2026', excerpt: 'Pelajaran soal abstraksi dini yang justru memperlambat tim.', tags: ['frontend'] },
      { title: 'Automasi Kecil yang Menghemat 10 Jam Sebulan', date: 'Des 2025', excerpt: 'Script sederhana sering lebih berdampak daripada tool mahal.', tags: ['automasi'] },
      { title: 'Panduan Onboarding Engineer Baru ala Tim Kami', date: 'Okt 2025', excerpt: 'Checklist yang kami pakai supaya hari pertama tidak membingungkan.', tags: ['tim', 'proses'] },
    ];
    return { posts };
  }
}
</script>
</body>
</html>
