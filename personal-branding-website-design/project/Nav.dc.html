<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="position:sticky;top:0;z-index:50;background:oklch(97% 0.015 85);border-bottom:2px solid oklch(20% 0.02 85);font-family:'JetBrains Mono',monospace">
  <div style="max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <a href="./Home.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:oklch(20% 0.02 85);font-weight:800;font-size:16px;transition:color .2s ease,transform .2s ease" style-hover="color:oklch(55% 0.15 150);transform:translateX(2px)">
      <span style="width:10px;height:10px;border-radius:2px;background:oklch(55% 0.15 150);display:inline-block;transition:transform .2s ease"></span>
      raka@portfolio<span style="color:oklch(55% 0.15 150)">:~$</span>
    </a>
    <div style="display:flex;gap:4px;flex-wrap:wrap;font-size:13px">
      <sc-for list="{{ links }}" as="item" hint-placeholder-count="6">
        <a href="{{ item.href }}" style="text-decoration:none;padding:6px 12px;border-radius:6px;color:{{ item.color }};background:{{ item.bg }};font-weight:{{ item.weight }};white-space:nowrap;transition:background .2s ease,color .2s ease,transform .15s ease" style-hover="background:oklch(90% 0.03 85);transform:translateY(-1px)">{{ item.label }}</a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;work&quot;,&quot;blog&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const items = [
      ['home','Home.dc.html','home'],
      ['work','Work.dc.html','work'],
      ['blog','Blog.dc.html','blog'],
      ['contact','Contact.dc.html','contact'],
    ];
    const links = items.map(([key,href,label]) => {
      const isActive = key === active;
      return {
        href: href.startsWith('Home.dc.html#') ? ('./' + href) : ('./' + href),
        label: isActive ? ('./' + label) : ('cd ' + label),
        color: isActive ? 'oklch(97% 0.015 85)' : 'oklch(20% 0.02 85)',
        bg: isActive ? 'oklch(20% 0.02 85)' : 'transparent',
        weight: isActive ? 700 : 500,
      };
    });
    return { links };
  }
}
</script>
</body>
</html>
