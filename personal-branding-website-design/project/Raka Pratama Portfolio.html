document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

out infinite\"><\u002Fspan>\n            open to kolaborasi &amp; full-time\n          <\u002Fdiv>\n          <h1 style=\"font-size:clamp(44px,6vw,72px);line-height:1.02;font-weight:700;margin:0 0 20px;letter-spacing:-0.03em;position:relative\">\n            Halo, saya<br>\n            <span style=\"position:relative;display:inline-block;color:oklch(20% 0.02 85)\">Raka Pratama\n              <svg sc-camel-view-box=\"0 0 260 16\" style=\"position:absolute;left:0;bottom:-8px;width:100%;height:16px\" sc-camel-preserve-aspect-ratio=\"none\">\n                <path d=\"M2 9 Q 40 2, 80 9 T 160 9 T 258 7\" fill=\"none\" stroke=\"oklch(70% 0.15 55)\" stroke-width=\"5\" stroke-linecap=\"round\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fh1>\n          <p style=\"font-size:19px;line-height:1.6;color:oklch(35% 0.02 85);max-width:520px;margin:0 0 28px\">\n            Software engineer fullstack yang senang mengubah ide berantakan jadi produk yang jalan. Fokus di web, mobile, dan otomasi berbasis AI.\n          <\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n            <a href=\"./Work.dc.html\" style=\"text-decoration:none;background:oklch(20% 0.02 85);color:oklch(97% 0.015 85);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;padding:14px 22px;border-radius:8px;display:inline-block;transition:transform 0.15s\" style-hover=\"background:oklch(55% 0.15 150);transform:translateY(-2px)\" style-active=\"transform:translateY(0px)\">./lihat-proyek.sh<\u002Fa>\n            <a href=\"./Contact.dc.html\" style=\"text-decoration:none;background:transparent;color:oklch(20% 0.02 85);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;padding:14px 22px;border-radius:8px;border:2px solid oklch(20% 0.02 85);display:inline-block;transition:transform 0.15s\" style-hover=\"background:oklch(90% 0.03 85);transform:translateY(-2px)\" style-active=\"transform:translateY(0px)\">say hello --wave<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;opacity:{{ heroOpacity }};transform:translateY({{ heroTranslate }}px) translateY({{ parallaxMed }}px);transition:opacity 0.8s ease 0.15s,transform 0.8s ease 0.15s\" sc-camel-on-mouse-move=\"{{ onTermMove }}\" sc-camel-on-mouse-leave=\"{{ onTermLeave }}\">\n          <div style=\"position:absolute;inset:-14px;border:2px dashed oklch(70% 0.15 55);border-radius:16px;animation:spin-slow 40s linear infinite;pointer-events:none\"><\u002Fdiv>\n          <div style=\"background:oklch(20% 0.02 85);border-radius:12px;overflow:hidden;box-shadow:8px 8px 0 oklch(70% 0.15 55);position:relative;animation:floaty 5s ease-in-out infinite;transform:perspective(800px) rotateX({{ tiltX }}deg) rotateY({{ tiltY }}deg);transition:transform 0.1s ease-out\">\n            <div style=\"display:flex;align-items:center;gap:6px;padding:10px 14px;background:oklch(15% 0.02 85)\">\n              <span style=\"width:10px;height:10px;border-radius:50%;background:#ff5f56\"><\u002Fspan>\n              <span style=\"width:10px;height:10px;border-radius:50%;background:#ffbd2e\"><\u002Fspan>\n              <span style=\"width:10px;height:10px;border-radius:50%;background:#27c93f\"><\u002Fspan>\n              <span style=\"margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(70% 0.02 85)\">whoami.sh<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:22px 20px 26px;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.9;color:oklch(90% 0.03 150);min-height:190px\">\n              <sc-for list=\"{{ termLines }}\" as=\"ln\" hint-placeholder-count=\"4\">\n                <div style=\"margin-top:{{ ln.mt }};color:{{ ln.color }}\"><span style=\"color:oklch(70% 0.15 55)\">{{ ln.prefix }}<\u002Fspan>{{ ln.text }}<sc-if value=\"{{ ln.showCursor }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"animation:blink 1s step-start infinite\">▌<\u002Fspan><\u002F er=\"transform:translateY(-3px)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:800;color:oklch(45% 0.14 150)\">{{ s.display }}<\u002Fdiv>\n          <div style=\"font-size:14px;color:oklch(35% 0.02 85);margin-top:4px\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div id=\"about\" style=\"margin-top:88px;scroll-margin-top:80px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:oklch(45% 0.14 150);margin-bottom:8px\">$ cat about.md<\u002Fdiv>\n      <h2 style=\"font-size:36px;font-weight:700;margin:0 0 32px;letter-spacing:-0.02em\">Tentang saya<\u002Fh2>\n      <div data-section=\"about\" style=\"display:grid;grid-template-columns:0.8fr 1.2fr;gap:40px;align-items:start;opacity:{{ aboutOpacity }};transform:translateY({{ aboutTransform }}px);transition:opacity 0.6s ease,transform 0.6s ease\">\n        <div style=\"background:oklch(20% 0.02 85);border-radius:12px;overflow:hidden;box-shadow:6px 6px 0 oklch(70% 0.16 150)\">\n          <div style=\"display:flex;align-items:center;gap:6px;padding:10px 14px;background:oklch(15% 0.02 85)\">\n            <span style=\"width:10px;height:10px;border-radius:50%;background:#ff5f56\"><\u002Fspan>\n            <span style=\"width:10px;height:10px;border-radius:50%;background:#ffbd2e\"><\u002Fspan>\n            <span style=\"width:10px;height:10px;border-radius:50%;background:#27c93f\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"aspect-ratio:1/1;background:repeating-linear-gradient(135deg, oklch(30% 0.02 85), oklch(30% 0.02 85) 10px, oklch(25% 0.02 85) 10px, oklch(25% 0.02 85) 20px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(80% 0.02 85)\">foto profil<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.85;color:oklch(30% 0.02 85)\">\n          <p>Saya Raka, software engineer yang mulai belajar coding dari mengutak-atik forum game waktu SMA — dan sampai sekarang belum berhenti penasaran. Sekarang fokus membangun produk web &amp; mobile yang cepat, rapi, dan enak dipakai.<\u002Fp>\n          <p>Beberapa tahun terakhir banyak berkutat dengan sistem yang harus scale, integrasi API yang berantakan, dan belakangan mulai serius eksplorasi automasi berbasis AI untuk mempercepat kerja tim.<\u002Fp>\n          <p>Di luar layar: ngopi, baca komik, dan sesekali nulis di blog soal hal-hal teknis yang baru dipelajari.<\u002Fp>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:24px\">\n            <sc-for list=\"{{ traits }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;background:oklch(90% 0.06 150);border:1.5px solid oklch(20% 0.02 85);border-radius:20px;padding:6px 14px;font-weight:600\">{{ t }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:72px\">\n      <h2 style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.08em;color:oklch(35% 0.02 85);text-transform:uppercase;margin:0 0 24px\">/ / keahlian teknis<\u002Fh2>\n      <div data-section=\"skills\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px;opacity:{{ skillsOpacity }};transform:translateY({{ skillsTransform }}px);transition:opacity 0.6s ease,transform 0.6s ease\">\n        <sc-for list=\"{{ skillGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"background:oklch(99% 0.01 85);border:2px solid oklch(20% 0.02 85);border-radius:10px;padding:22px\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n              <span style=\"width:8px;height:8px;border-radius:2px;background:{{ g.color }}\"><\u002Fspan>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px\">{{ g.title }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px\">\n                    <span style=\"font-weight:600\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;color:oklch(40% 0.02 85)\">{{ s.levelLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;border-radius:3px;background:oklch(90% 0.02 85);overflow:hidden\">\n                    <div style=\"height:100%;width:{{ s.levelPctLive }};background:{{ g.color }};border-radius:3px;transition:width 1s ease\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:20px\">\n        <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"10\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;background:oklch(93% 0.02 85);border-radius:8px;padding:8px 14px;font-weight:600\">{{ t }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:56px\">\n      <h2 style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.08em;color:oklch(35% 0.02 85);text-transform:uppercase;margin:0 0 24px\">/ / pendidikan<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:0\">\n        <sc-for list=\"{{ education }}\" as=\"e\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;gap:24px;padding:20px 0;border-bottom:1.5px solid oklch(85% 0.02 85)\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:oklch(45% 0.14 150);width:110px;flex-shrink:0;font-weight:700\">{{ e.year }}<\u002Fdiv>\n            <div>\n              <div style=\"font-weight:700;font-size:17px\">{{ e.school }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:oklch(40% 0.02 85);margin-top:2px\">{{ e.degree }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:72px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px\">\n      <h2 style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.08em;color:oklch(35% 0.02 85);text-transform:uppercase;margin:0\">/ / kerja terbaru<\u002Fh2>\n      <a href=\"./Work.dc.html\" style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;text-decoration:none;color:oklch(45% 0.14 150)\">lihat semua →<\u002Fa>\n    <\u002Fdiv>\n    <div data-section=\"featured\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px;padding-bottom:80px;opacity:{{ featuredOpacity }};transform:translateY({{ featuredTransform }}px);transition:opacity 0.6s ease,transform 0.6s ease\">\n      <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <a href=\"./Work.dc.html\" style=\"text-decoration:none;color:inherit;background:oklch(99% 0.01 85);border:2px solid oklch(20% 0.02 85);border-radius:10px;overflow:hidden;display:block;transition:transform 0.2s,box-shadow 0.2s\" style-hover=\"transform:translateY(-5px);box-shadow:6px 6px 0 oklch(70% 0.15 55)\">\n          <div style=\"aspect-ratio:16/10;background:repeating-linear-gradient(135deg, oklch(90% 0.03 85), oklch(90% 0.03 85) 10px, oklch(93% 0.02 85) 10px, oklch(93% 0.02 85) 20px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(45% 0.02 85)\">screenshot proyek<\u002Fdiv>\n          <div style=\"padding:16px\">\n            <div style=\"font-weight:700;font-size:15px;margin-bottom:6px\">{{ p.name }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:oklch(40% 0.02 85);line-height:1.5\">{{ p.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <dc-import name=\"Footer\" hint-size=\"100%,240px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    lineIndex: 0, charIndex: 0,\n    revealed: { stats: false, about: false, skills: false, featured: false },\n    statsN: [0, 0, 0],\n    scrollY: 0,\n    tiltX: 0, tiltY: 0,\n    heroIn: false,\n  };\n\n  linesData() {\n    return [\n      { prefix: '$ ', full: 'whoami', color: 'oklch(97% 0.01 85)' },\n      { prefix: '', full: 'Raka Pratama — Software Engineer', color: 'oklch(97% 0.01 85)' },\n      { prefix: '$ ', full: 'stack --primary', color: 'oklch(97% 0.01 85)' },\n      { prefix: '', full: 'TypeScript · React · Node.js · Python', color: 'oklch(97% 0.01 85)' },\n      { prefix: '$ ', full: 'location', color: 'oklch(97% 0.01 85)' },\n      { prefix: '', full: 'Jakarta, Indonesia (remote-friendly)', color: 'oklch(97% 0.01 85)' },\n      { prefix: '$ ', full: 'status', color: 'oklch(97% 0.01 85)' },\n    ];\n  }\n\n  componentDidMount() {\n    setTimeout(() => this.setState({ heroIn: true }), 60);\n\n    this._onScroll = () => {\n      this.setState({ scrollY: window.scrollY });\n      const vh = window.innerHeight;\n      const checks = { stats: 0.9, about: 0.85, skills: 0.85, featured: 0.85 };\n      let anyChange = false;\n      const next = { ...this.state.revealed };\n      Object.keys(checks).forEach(key => {\n        if (!next[key]) {\n          const el = document.querySelector('[data-section=\"' + key + '\"]');\n          if (el && el.getBoundingClientRect().top < vh * checks[key]) {\n            next[key] = true;\n            anyChange = true;\n            if (key === 'stats') this.startCount();\n          }\n        }\n      });\n      if (anyChange) this.setState({ revealed: next });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll);\n    setTimeout(this._onScroll, 80);\n\n    const lines = this.linesData();\n    this._typeTimer = setInterval(() => {\n      this.setState(s => {\n        if (s.lineIndex >= lines.length) return s;\n        const cur = lines[s.lineIndex];\n        if (s.charIndex < cur.full.length) return { charIndex: s.charIndex + 1 };\n        if (s.lineIndex + 1 < lines.length) return { lineIndex: s.lineIndex + 1, charIndex: 0 };\n        return { lineIndex: s.lineIndex + 1 };\n      });\n    }, 28);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._typeTimer);\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onScroll);\n  }\n\n  startCount() {\n    const targets = [4, 30, 12];\n    const start = Date.now();\n    const dur = 900;\n    const tick = () => {\n      const t = Math.min(1, (Date.now() - start) / dur);\n      this.setState({ statsN: targets.map(n => Math.round(n * t)) });\n      if (t < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  renderVals() {\n    const lines = this.linesData();\n    const termLines = lines.map((ln, i) => {\n      let text = '', showCursor = false;\n      if (i < this.state.lineIndex) text = ln.full;\n      else if (i === this.state.lineIndex) { text = ln.full.slice(0, this.state.charIndex); showCursor = true; }\n      return {\n        prefix: (i <= this.state.lineIndex) ? ln.prefix : '',\n        text, color: ln.color,\n        mt: ln.prefix === '$ ' && i > 0 ? '10px' : '0px',\n        showCursor,\n      };\n    });\n\n    const sy = this.state.scrollY;\n    const statsMeta = [\n      { suffix: '+', label: 'tahun pengalaman' },\n      { suffix: '+', label: 'proyek diselesaikan' },\n      { suffix: '', label: 'teknologi dikuasai' },\n    ];\n    const stats = statsMeta.map((m, i) => ({ display: this.state.statsN[i] + m.suffix, label: m.label }));\n\n    const mk = (name, level) => ({ name, levelLabel: ['dasar','menengah','mahir','ahli'][level-1], levelPct: (level*25) });\n    const groupsRaw = [\n      { title: 'Frontend', color: 'oklch(55% 0.15 150)', items: [mk('React / Next.js',4), mk('TypeScript',4), mk('CSS / Tailwind',4), mk('React Native',3)] },\n      { title: 'Backend', color: 'oklch(60% 0.14 85)', items: [mk('Node.js / Express',4), mk('PostgreSQL',3), mk('REST & GraphQL API',4), mk('Redis',3)] },\n      { title: 'AI & Automasi', color: 'oklch(70% 0.15 55)', items: [mk('LLM API Integration',3), mk('Python',4), mk('Workflow Automation',3), mk('Prompt Engineering',3)] },\n      { title: 'Infra & Tools', color: 'oklch(45% 0.02 85)', items: [mk('Docker',3), mk('AWS',3), mk('CI/CD',3), mk('Git',4)] },\n    ];\n    const skillsOn = this.state.revealed.skills;\n    const skillGroups = groupsRaw.map(g => ({\n      ...g,\n      items: g.items.map(it => ({ ...it, levelPctLive: (skillsOn ? it.levelPct : 0) + '%' })),\n    }));\n\n    const r = this.state.revealed;\n    return {\n      termLines,\n      parallaxSlow: sy * 0.08,\n      parallaxMed: sy * -0.06,\n      parallaxFast: sy * -0.12,\n      scrollRotate: sy * 0.05,\n      scrollRotateRev: -sy * 0.04,\n      heroOpacity: this.state.heroIn ? 1 : 0,\n      heroTranslate: this.state.heroIn ? 0 : 24,\n      scrollCueOpacity: Math.max(0, 1 - sy / 200),\n      tiltX: this.state.tiltX,\n      tiltY: this.state.tiltY,\n      onTermMove: (e) => {\n        const rect = e.currentTarget.getBoundingClientRect();\n        const px = (e.clientX - rect.left) / rect.width - 0.5;\n        const py = (e.clientY - rect.top) / rect.height - 0.5;\n        this.setState({ tiltX: py * -8, tiltY: px * 8 });\n      },\n      onTermLeave: () => this.setState({ tiltX: 0, tiltY: 0 }),\n      marqueeItems: ['TypeScript','React','Node.js','Python','PostgreSQL','Docker','AWS','Next.js','React Native','LLM APIs','TypeScript','React','Node.js','Python','PostgreSQL','Docker','AWS','Next.js','React Native','LLM APIs'],\n      stats,\n      statsOpacity: r.stats ? 1 : 0,\n      statsTransform: r.stats ? 0 : 24,\n      aboutOpacity: r.about ? 1 : 0,\n      aboutTransform: r.about ? 0 : 24,\n      skillsOpacity: r.skills ? 1 : 0,\n      skillsTransform: r.skills ? 0 : 24,\n      featuredOpacity: r.featured ? 1 : 0,\n      featuredTransform: r.featured ? 0 : 24,\n      traits: ['problem solver', 'detail-oriented', 'suka automasi', 'team player'],\n      skillGroups,\n      tools: ['VS Code', 'Figma', 'Postman', 'Linear', 'Notion', 'Vercel', 'GitHub Actions', 'Supabase', 'n8n'],\n      education: [\n        { year: '2016–2020', school: 'Universitas Indonesia', degree: 'S.Kom, Teknik Informatika' },\n        { year: '2021', school: 'Dicoding Academy', degree: 'Sertifikasi Backend & Cloud Engineer' },\n      ],\n      featured: [\n        { name: 'Nimbus — Analytics Dashboard', desc: 'Dashboard realtime untuk tim operasional, dibangun dengan React + WebSocket.' },\n        { name: 'Loop AI Assistant', desc: 'Asisten otomasi berbasis LLM untuk tiket support internal.' },\n        { name: 'Pasar Lokal App', desc: 'Aplikasi mobile marketplace UMKM, React Native + Node.js.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
