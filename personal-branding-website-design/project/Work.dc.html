<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(97% 0.015 85)}
  a{color:oklch(45% 0.14 150)}
  a:hover{color:oklch(35% 0.14 150)}
</style>
</helmet>
<div style="font-family:'Space Grotesk',sans-serif;color:oklch(20% 0.02 85);min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="Nav" active="work" hint-size="100%,56px"></dc-import>

  <div style="flex:1;max-width:1100px;margin:0 auto;padding:56px 24px 40px;width:100%;box-sizing:border-box">
    <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:oklch(45% 0.14 150);margin-bottom:8px">$ git log --experience</div>
    <h1 style="font-size:42px;font-weight:700;margin:0 0 40px;letter-spacing:-0.02em">Pengalaman & proyek</h1>

    <h2 style="font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.08em;color:oklch(35% 0.02 85);text-transform:uppercase;margin:0 0 24px">/ / riwayat kerja</h2>
    <div style="position:relative;padding-left:28px;max-width:820px">
      <div style="position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:oklch(85% 0.02 85)"></div>
      <sc-for list="{{ jobs }}" as="j" hint-placeholder-count="4">
        <div style="position:relative;padding-bottom:36px">
          <div style="position:absolute;left:-28px;top:4px;width:12px;height:12px;border-radius:50%;background:{{ j.dotColor }};border:2px solid oklch(20% 0.02 85)"></div>
          <div style="background:oklch(99% 0.01 85);border:2px solid oklch(20% 0.02 85);border-radius:10px;padding:22px;transition:transform 0.2s,box-shadow 0.2s" style-hover="transform:translateY(-3px);box-shadow:4px 4px 0 oklch(70% 0.15 55)">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px">
              <div style="font-weight:700;font-size:17px">{{ j.role }}</div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:oklch(40% 0.02 85);background:oklch(93% 0.02 85);padding:4px 10px;border-radius:12px;white-space:nowrap">{{ j.period }}</div>
            </div>
            <div style="font-size:14px;font-weight:600;color:oklch(45% 0.14 150);margin-bottom:12px">{{ j.company }} · {{ j.location }}</div>
            <ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.65;color:oklch(32% 0.02 85)">
              <sc-for list="{{ j.points }}" as="pt" hint-placeholder-count="3">
                <li>{{ pt }}</li>
              </sc-for>
            </ul>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
              <sc-for list="{{ j.tags }}" as="tag" hint-placeholder-count="3">
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;background:oklch(93% 0.02 85);border-radius:5px;padding:3px 8px;color:oklch(35% 0.02 85)">{{ tag }}</span>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top:24px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:16px">
      <h2 style="font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.08em;color:oklch(35% 0.02 85);text-transform:uppercase;margin:0">/ / proyek</h2>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px">
      <sc-for list="{{ categories }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.onClick }}" style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;border-radius:20px;padding:8px 16px;cursor:pointer;border:2px solid oklch(20% 0.02 85);background:{{ c.bg }};color:{{ c.fg }};transition:transform 0.15s,background 0.2s,color 0.2s" style-hover="transform:translateY(-2px)" style-active="transform:translateY(0px)">{{ c.label }}</button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
      <sc-for list="{{ filtered }}" as="p" hint-placeholder-count="6">
        <div style="background:oklch(99% 0.01 85);border:2px solid oklch(20% 0.02 85);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform 0.2s,box-shadow 0.2s" style-hover="transform:translateY(-5px);box-shadow:6px 6px 0 oklch(70% 0.15 55)">
          <div style="aspect-ratio:16/10;background:repeating-linear-gradient(135deg, oklch(90% 0.03 85), oklch(90% 0.03 85) 10px, oklch(93% 0.02 85) 10px, oklch(93% 0.02 85) 20px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(45% 0.02 85)">screenshot proyek</div>
          <div style="padding:18px;display:flex;flex-direction:column;flex:1">
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:oklch(45% 0.14 150);font-weight:700;margin-bottom:6px;text-transform:uppercase">{{ p.category }}</div>
            <div style="font-weight:700;font-size:16px;margin-bottom:6px">{{ p.name }}</div>
            <div style="font-size:13.5px;color:oklch(40% 0.02 85);line-height:1.55;flex:1">{{ p.desc }}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0">
              <sc-for list="{{ p.tags }}" as="tag" hint-placeholder-count="3">
                <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;background:oklch(93% 0.02 85);border-radius:5px;padding:3px 7px;color:oklch(35% 0.02 85)">{{ tag }}</span>
              </sc-for>
            </div>
            <div style="display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700">
              <a href="#" style="text-decoration:none;transition:transform 0.15s;display:inline-block" style-hover="transform:translateX(2px)">live →</a>
              <a href="#" style="text-decoration:none;color:oklch(20% 0.02 85);transition:transform 0.15s;display:inline-block" style-hover="transform:translateX(2px)">code →</a>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <dc-import name="Footer" hint-size="100%,240px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: 'semua' };

  jobs() {
    return [
      {
        role: 'Senior Software Engineer', company: 'Vela Teknologi', location: 'Jakarta', period: '2023 — sekarang',
        dotColor: 'oklch(55% 0.15 150)',
        points: [
          'Memimpin migrasi monolith ke microservices, menurunkan latency API rata-rata 40%.',
          'Membangun pipeline automasi berbasis LLM untuk triage tiket support, hemat ~15 jam/minggu tim ops.',
          'Mentoring 3 engineer junior dan menstandarkan code review process.',
        ],
        tags: ['TypeScript', 'Node.js', 'AWS', 'PostgreSQL'],
      },
      {
        role: 'Software Engineer', company: 'Nimbus Labs', location: 'Jakarta (remote)', period: '2021 — 2023',
        dotColor: 'oklch(60% 0.14 85)',
        points: [
          'Membangun dashboard analytics realtime dipakai 200+ pengguna internal harian.',
          'Mengembangkan REST & WebSocket API untuk fitur kolaborasi live.',
          'Menulis test suite yang menaikkan coverage dari 32% ke 78%.',
        ],
        tags: ['React', 'Express', 'WebSocket', 'Docker'],
      },
      {
        role: 'Frontend Engineer', company: 'Studio Kecil', location: 'Bandung', period: '2020 — 2021',
        dotColor: 'oklch(70% 0.15 55)',
        points: [
          'Membangun 6+ landing page & aplikasi web untuk klien UMKM.',
          'Menyusun component library internal untuk mempercepat delivery proyek.',
        ],
        tags: ['React', 'Figma', 'Tailwind'],
      },
      {
        role: 'Software Engineering Intern', company: 'Startup Pagi', location: 'Jakarta', period: '2019 — 2020',
        dotColor: 'oklch(50% 0.02 85)',
        points: [
          'Membantu membangun fitur checkout untuk aplikasi marketplace UMKM.',
          'Belajar dasar CI/CD dan code review process di tim produksi.',
        ],
        tags: ['JavaScript', 'MySQL'],
      },
    ];
  }

  allProjects() {
    return [
      { name: 'Nimbus Analytics Dashboard', category: 'web', desc: 'Dashboard realtime untuk tim ops dengan visualisasi live metrics.', tags: ['React', 'WebSocket', 'D3'] },
      { name: 'Loop AI Assistant', category: 'ai', desc: 'Asisten LLM untuk triage & auto-response tiket support internal.', tags: ['Python', 'OpenAI API', 'FastAPI'] },
      { name: 'Pasar Lokal App', category: 'mobile', desc: 'Marketplace UMKM dengan katalog, chat, dan pembayaran terintegrasi.', tags: ['React Native', 'Node.js'] },
      { name: 'DevFlow CLI', category: 'backend', desc: 'CLI internal untuk scaffolding service baru dalam hitungan detik.', tags: ['Go', 'Cobra'] },
      { name: 'Resep Rumahan', category: 'web', desc: 'Platform berbagi resep dengan pencarian berbasis bahan yang ada.', tags: ['Next.js', 'Postgres'] },
      { name: 'AutoInvoice', category: 'automation', desc: 'Automasi pembuatan & pengiriman invoice bulanan dari data spreadsheet.', tags: ['Python', 'Zapier', 'GCP'] },
      { name: 'FitTrack Mobile', category: 'mobile', desc: 'Aplikasi pelacak kebugaran dengan sinkronisasi wearable.', tags: ['Flutter', 'Firebase'] },
      { name: 'Kode Bareng', category: 'web', desc: 'Platform belajar coding kolaboratif dengan editor realtime.', tags: ['React', 'Socket.io', 'Redis'] },
      { name: 'Notif Cerdas', category: 'ai', desc: 'Sistem prioritas notifikasi berbasis machine learning ringan.', tags: ['Python', 'scikit-learn'] },
    ];
  }

  renderVals() {
    const cats = ['semua', 'web', 'mobile', 'backend', 'ai', 'automation'];
    const labels = { semua: 'semua', web: 'web', mobile: 'mobile', backend: 'backend', ai: 'ai/ml', automation: 'automasi' };
    const active = this.state.active;
    const categories = cats.map(c => ({
      label: labels[c],
      onClick: () => this.setState({ active: c }),
      bg: c === active ? 'oklch(20% 0.02 85)' : 'transparent',
      fg: c === active ? 'oklch(97% 0.015 85)' : 'oklch(20% 0.02 85)',
    }));
    const all = this.allProjects();
    const filtered = active === 'semua' ? all : all.filter(p => p.category === active);
    return { jobs: this.jobs(), categories, filtered };
  }
}
</script>
</body>
</html>
